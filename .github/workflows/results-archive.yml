# Election-night results archive in the cloud: the same scripts/archive-results.mjs the Mac runs,
# on GitHub's runners, so the night is recorded even if the laptop sleeps.
#
# A job may run 6 hours at most, so the night is a chain of runs, each archiving one CHUNK (60 min)
# of the window, uploading it as an artifact (a lost run costs at most that hour), and dispatching
# the next run LEAD minutes before it ends; the next run's archiver waits for its exact start, so
# the 2-minute cadence carries across runs. A run dispatched long before the window only sleeps
# and hands on. The schedule below is a watchdog: if no dispatched run is alive during the night it
# restarts the chain on the same 2-minute grid.
#
# Start:   Actions → Results archive → Run workflow (the defaults are election night), or
#          POST /repos/{owner}/{repo}/actions/workflows/results-archive.yml/dispatches
# Stop:    disable the workflow (Actions → Results archive → ⋯ → Disable), then cancel live runs.
# Collect: download the run artifacts into data-entry/results-archive/<set>/ (each holds one hour).
name: Results archive

on:
  workflow_dispatch:
    inputs:
      set:
        description: Archive folder name (data-entry/results-archive/<set>)
        default: 2026-11-03-cloud
      start:
        description: Window start, ISO UTC (5:45 PM ET)
        default: "2026-11-03T22:45:00Z"
      until:
        description: Window end, ISO UTC (noon ET Nov 4)
        default: "2026-11-04T17:00:00Z"
      interval:
        description: Minutes between snapshots
        default: "2"
      chunk_minutes:
        description: Minutes archived per run (one artifact each)
        default: "60"
      lead_minutes:
        description: Minutes before a run ends that it dispatches the next one
        default: "6"
  schedule:
    # Watchdog, every 30 minutes through the night (UTC): Nov 3 22:00 → Nov 4 16:30.
    - cron: "*/30 22-23 3 11 *"
    - cron: "*/30 0-16 4 11 *"

permissions:
  actions: write
  contents: read

jobs:
  archive:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      SET: ${{ inputs.set }}
      START: ${{ inputs.start }}
      UNTIL: ${{ inputs.until }}
      INTERVAL: ${{ inputs.interval }}
      CHUNK: ${{ inputs.chunk_minutes }}
      LEAD: ${{ inputs.lead_minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/archive-results.mjs
            data-entry/civicapi_race_ids.csv
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Plan this run
        id: plan
        run: |
          now=$(date -u +%s); start=$(date -u -d "$START" +%s); until=$(date -u -d "$UNTIL" +%s); step=$((INTERVAL * 60))
          if [ "$now" -ge "$until" ]; then echo "Window over"; echo "mode=done" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A start already past (a watchdog restart) moves to the next point on the snapshot grid.
          if [ "$start" -lt "$now" ]; then start=$((start + ((now - start + step - 1) / step) * step)); fi
          if [ $((start - now)) -gt $((270 * 60)) ]; then
            echo "mode=wait" >> "$GITHUB_OUTPUT"
          else
            end=$((start + CHUNK * 60)); [ "$end" -gt "$until" ] && end=$until
            echo "mode=archive" >> "$GITHUB_OUTPUT"
            echo "chunk_start=$(date -u -d @$start +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
            echo "chunk_end=$(date -u -d @$end +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
            echo "chunk_end_s=$end" >> "$GITHUB_OUTPUT"
            echo "until_s=$until" >> "$GITHUB_OUTPUT"
            echo "stamp=$(date -u -d @$start +%Y%m%dT%H%MZ)" >> "$GITHUB_OUTPUT"
          fi
          echo "now $(date -u +%FT%TZ) · window $START → $UNTIL · this run starts $(date -u -d @$start +%FT%TZ)"

      - name: Wait and hand on (window still more than 4.5 h away)
        if: steps.plan.outputs.mode == 'wait'
        run: |
          sleep $((240 * 60))
          for i in 1 2 3 4 5; do
            gh workflow run results-archive.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f set="$SET" -f start="$START" -f until="$UNTIL" -f interval="$INTERVAL" -f chunk_minutes="$CHUNK" -f lead_minutes="$LEAD" && exit 0
            sleep 20
          done
          exit 1

      - name: Archive one chunk, dispatching the next run before it ends
        if: steps.plan.outputs.mode == 'archive'
        env:
          CHUNK_START: ${{ steps.plan.outputs.chunk_start }}
          CHUNK_END: ${{ steps.plan.outputs.chunk_end }}
          CHUNK_END_S: ${{ steps.plan.outputs.chunk_end_s }}
          UNTIL_S: ${{ steps.plan.outputs.until_s }}
        run: |
          # Stop just after the chunk's last on-grid snapshot (the next run takes the boundary one).
          stop=$(date -u -d @$((CHUNK_END_S - 115)) +%Y-%m-%dT%H:%M:%SZ)
          [ "$CHUNK_END_S" -ge "$UNTIL_S" ] && stop=$CHUNK_END
          node scripts/archive-results.mjs "$INTERVAL" --set "$SET" --start "$CHUNK_START" --until "$stop" &
          archiver=$!
          if [ "$CHUNK_END_S" -lt "$UNTIL_S" ]; then
            wake=$((CHUNK_END_S - LEAD * 60 - $(date -u +%s))); [ "$wake" -gt 0 ] && sleep "$wake"
            ok=0
            for i in 1 2 3 4 5; do
              if gh workflow run results-archive.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
                -f set="$SET" -f start="$CHUNK_END" -f until="$UNTIL" -f interval="$INTERVAL" -f chunk_minutes="$CHUNK" -f lead_minutes="$LEAD"; then ok=1; break; fi
              sleep 20
            done
            [ "$ok" = 1 ] && echo "Dispatched the next run (from $CHUNK_END)" || echo "::warning::Could not dispatch the next run; the watchdog will restart the chain"
          fi
          wait "$archiver"

      - name: Upload this chunk
        if: always() && steps.plan.outputs.mode == 'archive'
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ inputs.set }}-${{ steps.plan.outputs.stamp }}
          path: data-entry/results-archive/${{ inputs.set }}/
          retention-days: 30
          if-no-files-found: warn

  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Restart the chain if no archive run is alive
        run: |
          alive=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow results-archive.yml --event workflow_dispatch --limit 20 \
            --json status --jq '[.[] | select(.status != "completed")] | length')
          echo "live dispatched runs: $alive"
          if [ "$alive" = "0" ]; then
            echo "::warning::No archive run alive; restarting the chain"
            gh workflow run results-archive.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          fi
